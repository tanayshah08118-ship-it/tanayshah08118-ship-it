name: Generate Git Koi

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# ADD THESE 3 LINES RIGHT HERE:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Git Profile Koi
        uses: yalongwastaken/git-koi@main
        with:
          login: 'tanayshah08118-ship-it'
          body: 'nord'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update profile koi" || exit 0
          git push
