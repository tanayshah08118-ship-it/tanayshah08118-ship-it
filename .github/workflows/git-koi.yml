name: Generate Git Koi

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Git Profile Koi
        uses: yalongwastaken/git-koi@main
        with:
          # Use 'login' instead of username
          login: 'tanayshah08118-ship-it'
          
          # Use 'body' to change the colors (options: classic, nord, dracula, sunset)
          body: 'nord'
          
          # Provide your authentication token so it can read your profile stats
          token: ${{ secrets.GITHUB_TOKEN }}

          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "Update profile koi" || exit 0
          git push
