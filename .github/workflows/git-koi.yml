name: Generate Git Koi

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Git Profile Koi
        uses: yalongwastaken/git-koi@main
        with:
          login: 'tanayshah08118-ship-it'
          body: 'gold'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git switch main || git checkout main
          git add .
          git commit -m "Update profile koi assets" || exit 0
          git push origin main
